name: Native and compiled module
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/test-remix-markers-tests.py
      - run: python3 scripts/test-workspace-tests.py
      - run: cargo fmt --all -- --check
      - run: scripts/test-workspace.sh --no-default-features
      - run: scripts/test-workspace.sh --all-features
      - name: Check normal and build dependency trees
        run: |
          scripts/check-storage-engine-trees.sh --self-test
          scripts/check-storage-engine-trees.sh
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build -p tinymemes-module
      - name: Execute the compiled module through its minimal contract
        run: cargo run -p tinymemes-client --example compiled_state -- target/debug/libtinymemes_module.so

      - name: Execute authenticated persistent markers against native ports
        run: scripts/test-remix-markers.sh
      - run: cargo fmt --manifest-path proof-workspaces/remix-markers/Cargo.toml -- --check
      - run: cargo clippy --manifest-path proof-workspaces/remix-markers/Cargo.toml --all-targets -- -D warnings
