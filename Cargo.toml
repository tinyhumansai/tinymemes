[workspace]
exclude = ["proof-workspaces/remix-markers"]
members = [".", "crates/tinymemes-bus", "crates/tinymemes-client", "crates/tinymemes-module"]
resolver = "2"

[package]
name = "tinymemes"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
# Never published to crates.io: hosts (OpenHuman, Chottu) vendor it by path.
# Saying so lets their supply-chain checks treat its path and git dependencies
# as first-party instead of as wildcard registry requirements.
publish = false
description = "Reads a chat with Jev, rates how much fun a reply can take, and remixes it with slang and memes."
repository = "https://github.com/tinyhumansai/tinymemes"
readme = "README.md"
keywords = ["memes", "llm", "openhuman", "jev", "chat"]
categories = ["text-processing"]

[dependencies]
tinymemes-bus = { path = "crates/tinymemes-bus" }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
# Jev decision model client. OpenHuman redirects this to its vendored copy via
# `[patch."https://github.com/tinyhumansai/tinyinference"]`, so the host and
# this module share one `tinyinference-decisions` package.
tinyinference-decisions = { version = "0.3.0", git = "https://github.com/tinyhumansai/tinyinference", rev = "abf90568a24b826d49900150b20856ef166df3f8" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

# tinystoragedrivers v0.11.0 pins tinybus d5b949be; every declaration here uses
# the same rev so the graph holds one copy, and cargo's replacement selector
# (source/name/version, not revision) moves that copy to the tinybus main commit
# OpenHuman pins. Drop once a tinystoragedrivers tag pins that commit itself.
[replace]
"https://github.com/tinyhumansai/tinybus#tinybus:0.1.5" = { git = "https://github.com/tinyhumansai/tinybus", rev = "f11987b0b44c92da2064a4b3787ca7527a23db26" }
"https://github.com/tinyhumansai/tinybus#tinybus-module:0.1.5" = { git = "https://github.com/tinyhumansai/tinybus", rev = "f11987b0b44c92da2064a4b3787ca7527a23db26" }
