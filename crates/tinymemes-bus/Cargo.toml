[package]
name = "tinymemes-bus"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Content-only TinyMemes contract: wire types, member names and versions. Synchronous and I/O-free."
repository = "https://github.com/tinyhumansai/tinymemes"

[features]
default = []
# Kept for hosts that used to gate the declaration module at build time. The
# declaration now contains pure wire types only and is available in every build.
storage = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinystoragedrivers-types = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
