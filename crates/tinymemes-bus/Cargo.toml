[package]
name = "tinymemes-bus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Content-only TinyMemes state contract and typed TinyBus client."
repository = "https://github.com/tinyhumansai/tinymemes"

[features]
default = []
host-callback = ["tinybus/modules"]

[dependencies]
tinystoragedrivers-bus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a981da30c29c50b89f348ac1376fc7b9469bcbec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "40814a8279ff71b8fb411f9f29362c8ec0be51e2", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "40814a8279ff71b8fb411f9f29362c8ec0be51e2", default-features = false, features = ["modules"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
