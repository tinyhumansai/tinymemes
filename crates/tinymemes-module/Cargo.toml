[package]
name = "tinymemes-module"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "TinyMemes content transforms and admitted catalog operations over the module ABI."
repository = "https://github.com/tinyhumansai/tinymemes"

[features]
default = []
# Link the module into a host binary without exporting the shared C names; the
# host admits it in-process with `linked_module()`.
static-link = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tinystoragedrivers-api = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers-busproxy = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers-types = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinymemes = { path = "../.." }
tinymemes-bus = { path = "../tinymemes-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "11b0a728e62a5b7ae213c1cf6366f82b9e1a65de", default-features = false }
tinybus-module = { git = "https://github.com/tinyhumansai/tinybus", rev = "11b0a728e62a5b7ae213c1cf6366f82b9e1a65de" }

[dev-dependencies]
tinymemes-client = { path = "../tinymemes-client", features = ["host-callback"] }
tinystoragedrivers-testkit = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "11b0a728e62a5b7ae213c1cf6366f82b9e1a65de", default-features = false, features = ["modules"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "static_link"
path = "tests/static_link.rs"
required-features = ["static-link"]
