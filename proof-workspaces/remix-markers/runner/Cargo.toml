[package]
name = "tinymemes-remix-marker-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
tinymemes-bus = { path = "../../../crates/tinymemes-bus", features = ["host-callback"] }
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "40814a8279ff71b8fb411f9f29362c8ec0be51e2", default-features = false, features = ["modules"] }
tinystoragedrivers-bus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a981da30c29c50b89f348ac1376fc7b9469bcbec" }
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a981da30c29c50b89f348ac1376fc7b9469bcbec" }
tinystoragedrivers-tinybus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a981da30c29c50b89f348ac1376fc7b9469bcbec" }
tinystoragedrivers-sqlite = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a981da30c29c50b89f348ac1376fc7b9469bcbec" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3"
async-trait = "0.1"
